
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi lista de tareas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f3f4f6;
    }

    section {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
    }

    li {
      margin: 12px 0;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    .completada {
      text-decoration: line-through;
      color: gray;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>
  <section>
    <h1>Mi lista de tareas</h1>

    <form id="formulario">
      <input id="nombreTarea" type="text"
        placeholder="Escribe una tarea" required>
      <input id="prioridad" type="text"
        placeholder="Prioridad" required>
      <button type="submit">Agregar</button>
    </form>

    <p id="mensaje"></p>
    <ul id="listaTareas"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
